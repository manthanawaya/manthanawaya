<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&amp;display=swap');

      .bg { fill: #0d1117; }

      /* Grid lines */
      .grid { stroke: #1a2332; stroke-width: 0.5; }

      /* Orbiting dots */
      .orbit-ring { fill: none; stroke: #1e3a5f; stroke-width: 1; stroke-dasharray: 4 6; }

      .dot1 { fill: #00d9ff; animation: orbit1 6s linear infinite; }
      .dot2 { fill: #8b5cf6; animation: orbit2 9s linear infinite; }
      .dot3 { fill: #f97316; animation: orbit3 12s linear infinite; }
      .dot4 { fill: #00d9ff; animation: orbit1 6s linear infinite reverse; opacity: 0.5; }

      @keyframes orbit1 {
        0%   { transform: rotate(0deg)   translateX(120px) rotate(0deg); }
        100% { transform: rotate(360deg) translateX(120px) rotate(-360deg); }
      }
      @keyframes orbit2 {
        0%   { transform: rotate(45deg)  translateX(170px) rotate(-45deg); }
        100% { transform: rotate(405deg) translateX(170px) rotate(-405deg); }
      }
      @keyframes orbit3 {
        0%   { transform: rotate(200deg) translateX(210px) rotate(-200deg); }
        100% { transform: rotate(560deg) translateX(210px) rotate(-560deg); }
      }

      /* Main name */
      .name {
        font-family: 'Fira Code', monospace;
        font-size: 48px;
        font-weight: 700;
        fill: url(#nameGrad);
        animation: fadeSlideIn 1s ease forwards;
        opacity: 0;
      }
      @keyframes fadeSlideIn {
        from { opacity: 0; transform: translateY(-20px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* Subtitle lines */
      .sub1 {
        font-family: 'Fira Code', monospace;
        font-size: 15px;
        fill: #00d9ff;
        animation: fadeSlideIn 1s ease 0.4s forwards;
        opacity: 0;
      }
      .sub2 {
        font-family: 'Fira Code', monospace;
        font-size: 13px;
        fill: #8b949e;
        animation: fadeSlideIn 1s ease 0.8s forwards;
        opacity: 0;
      }

      /* Bracket decorations */
      .bracket {
        font-family: 'Fira Code', monospace;
        font-size: 80px;
        fill: #1e3a5f;
        animation: pulse 3s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.3; }
        50%       { opacity: 0.8; }
      }

      /* Blinking cursor */
      .cursor {
        fill: #00d9ff;
        animation: blink 1s step-end infinite;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0; }
      }

      /* Corner accents */
      .corner { stroke: #00d9ff; stroke-width: 2; fill: none;
                animation: cornerIn 0.8s ease forwards; opacity: 0; }
      .c2 { animation-delay: 0.2s; }
      @keyframes cornerIn {
        from { opacity: 0; stroke-dashoffset: 60; }
        to   { opacity: 1; stroke-dashoffset: 0; }
      }
      .corner { stroke-dasharray: 60; }

      /* Tag labels */
      .tag-pill { rx: 10; animation: fadeSlideIn 1s ease 1.2s forwards; opacity: 0; }
      .tag-text {
        font-family: 'Fira Code', monospace;
        font-size: 11px;
        animation: fadeSlideIn 1s ease 1.2s forwards;
        opacity: 0;
      }

      /* Particle field */
      .p { animation: twinkle var(--d, 3s) ease-in-out infinite; fill: #00d9ff; }
      @keyframes twinkle {
        0%, 100% { opacity: 0.1; r: 1; }
        50%       { opacity: 0.8; r: 2; }
      }

      /* Bottom bar */
      .bar-bg { fill: #161b22; }
      .bar-fill {
        fill: url(#barGrad);
        animation: barGrow 2s ease 1.5s forwards;
        transform-origin: left center;
        transform: scaleX(0);
      }
      @keyframes barGrow {
        to { transform: scaleX(1); }
      }

      /* Scan line */
      .scanline {
        fill: none;
        stroke: rgba(0,217,255,0.08);
        stroke-width: 1;
        animation: scan 4s linear infinite;
      }
      @keyframes scan {
        0%   { transform: translateY(-280px); }
        100% { transform: translateY(280px); }
      }
    </style>

    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00d9ff"/>
      <stop offset="50%"  stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00d9ff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect class="bg" width="900" height="280" rx="12"/>

  <!-- Grid -->
  <g opacity="0.4">
    <line class="grid" x1="0" y1="40"  x2="900" y2="40"/>
    <line class="grid" x1="0" y1="80"  x2="900" y2="80"/>
    <line class="grid" x1="0" y1="120" x2="900" y2="120"/>
    <line class="grid" x1="0" y1="160" x2="900" y2="160"/>
    <line class="grid" x1="0" y1="200" x2="900" y2="200"/>
    <line class="grid" x1="0" y1="240" x2="900" y2="240"/>
    <line class="grid" x1="80"  y1="0" x2="80"  y2="280"/>
    <line class="grid" x1="160" y1="0" x2="160" y2="280"/>
    <line class="grid" x1="240" y1="0" x2="240" y2="280"/>
    <line class="grid" x1="320" y1="0" x2="320" y2="280"/>
    <line class="grid" x1="400" y1="0" x2="400" y2="280"/>
    <line class="grid" x1="480" y1="0" x2="480" y2="280"/>
    <line class="grid" x1="560" y1="0" x2="560" y2="280"/>
    <line class="grid" x1="640" y1="0" x2="640" y2="280"/>
    <line class="grid" x1="720" y1="0" x2="720" y2="280"/>
    <line class="grid" x1="800" y1="0" x2="800" y2="280"/>
  </g>

  <!-- Scan line effect -->
  <rect class="scanline" x="0" y="0" width="900" height="40"/>

  <!-- Orbit system (right side) -->
  <g transform="translate(760, 140)">
    <circle class="orbit-ring" cx="0" cy="0" r="120"/>
    <circle class="orbit-ring" cx="0" cy="0" r="170"/>
    <circle class="orbit-ring" cx="0" cy="0" r="210"/>
    <circle class="dot1" cx="0" cy="0" r="5"/>
    <circle class="dot2" cx="0" cy="0" r="4"/>
    <circle class="dot3" cx="0" cy="0" r="6"/>
    <circle class="dot4" cx="0" cy="0" r="3"/>
    <!-- Center glow -->
    <circle cx="0" cy="0" r="18" fill="#00d9ff" opacity="0.08"/>
    <circle cx="0" cy="0" r="10" fill="#00d9ff" opacity="0.15"/>
    <circle cx="0" cy="0" r="4"  fill="#00d9ff" opacity="0.9"/>
  </g>

  <!-- Particles -->
  <circle class="p" cx="50"  cy="30"  r="1.5" style="--d:2.1s"/>
  <circle class="p" cx="130" cy="60"  r="1"   style="--d:3.4s"/>
  <circle class="p" cx="210" cy="20"  r="2"   style="--d:1.8s"/>
  <circle class="p" cx="290" cy="50"  r="1.5" style="--d:4.2s"/>
  <circle class="p" cx="370" cy="15"  r="1"   style="--d:2.7s"/>
  <circle class="p" cx="60"  cy="250" r="1.5" style="--d:3.1s"/>
  <circle class="p" cx="150" cy="230" r="1"   style="--d:1.5s"/>
  <circle class="p" cx="250" cy="260" r="2"   style="--d:3.8s"/>
  <circle class="p" cx="350" cy="240" r="1"   style="--d:2.3s"/>

  <!-- Corner accents TL -->
  <polyline class="corner"    points="20,50 20,20 50,20"/>
  <polyline class="corner c2" points="880,50 880,20 850,20"/>
  <polyline class="corner"    points="20,230 20,260 50,260"/>
  <polyline class="corner c2" points="880,230 880,260 850,260"/>

  <!-- Bracket decorations -->
  <text class="bracket" x="28" y="180">{</text>
  <text class="bracket" x="570" y="180">}</text>

  <!-- Main name -->
  <text class="name" x="100" y="125" text-anchor="start">Manthan Awaya</text>

  <!-- Cursor -->
  <rect class="cursor" x="576" y="88" width="3" height="38" rx="1"/>

  <!-- Subtitle line 1 -->
  <text class="sub1" x="100" y="160">
    &lt;B.Tech CS @ VIT Bhopal /&gt;   &lt;DSA + Python + Flask /&gt;
  </text>

  <!-- Subtitle line 2 -->
  <text class="sub2" x="100" y="185">
    // building AI tools · turning logic into solutions · hackathon veteran
  </text>

  <!-- Tag pills -->
  <rect class="tag-pill" x="100" y="205" width="80"  height="22" rx="11" fill="#0a2540" stroke="#00d9ff" stroke-width="0.8"/>
  <rect class="tag-pill" x="190" y="205" width="68"  height="22" rx="11" fill="#1a0a40" stroke="#8b5cf6" stroke-width="0.8"/>
  <rect class="tag-pill" x="268" y="205" width="80"  height="22" rx="11" fill="#2a0e00" stroke="#f97316" stroke-width="0.8"/>
  <rect class="tag-pill" x="358" y="205" width="90"  height="22" rx="11" fill="#0a2540" stroke="#00d9ff" stroke-width="0.8"/>

  <text class="tag-text" x="140"  y="220" text-anchor="middle" fill="#00d9ff">Python</text>
  <text class="tag-text" x="224"  y="220" text-anchor="middle" fill="#8b5cf6">C++</text>
  <text class="tag-text" x="308"  y="220" text-anchor="middle" fill="#f97316">Hackathon</text>
  <text class="tag-text" x="403"  y="220" text-anchor="middle" fill="#00d9ff">Open Source</text>

  <!-- Bottom animated bar -->
  <rect class="bar-bg"  x="0" y="268" width="900" height="4" rx="2"/>
  <rect class="bar-fill" x="0" y="268" width="900" height="4" rx="2"/>
</svg>
